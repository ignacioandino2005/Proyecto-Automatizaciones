<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textos Automáticos</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-family: sans-serif;}
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .error { text-align: center; }
    </style>
</head>
<body>
    <iframe id="appFrame" style="display:none;"></iframe>
    <div id="errorMsg" class="error" style="display:none;">
        <h2>Acceso No Autorizado</h2>
        <p>Este enlace no es válido o ha expirado.</p>
    </div>

    <script>
        // Tu lista estricta de clientes activos
        const baseDeClientes = {
            "ipsanjuan": "https://script.google.com/macros/s/AKfycbx84deOsWPGZhP0a8YGH6sMs-cOKwOhHCc-iOzj3f7N7yTD7C8t-5wYQEkaeP5f0qBdBA/exec",
            "cliente2": "https://script.google.com/macros/s/AKfycbwCWABG51tqE6Ia9az7uukVxp50Z7ekeRu0tBDRe_xs3H4AJ7E5QkBO2BFedFV6axCU/exec"
     
        };

        const urlParams = new URLSearchParams(window.location.search);
        const clienteKey = urlParams.get('app');
        
        // Validar si el cliente existe en la lista
        if (clienteKey && baseDeClientes[clienteKey]) {
            document.getElementById('appFrame').src = baseDeClientes[clienteKey];
            document.getElementById('appFrame').style.display = 'block';
        } else {
            // Si no existe o no se pasa el parámetro ?app=, mostrar error y bloquear
            document.getElementById('errorMsg').style.display = 'block';
        }
    </script>
</body>
</html>
